{
  "backend": {
    "name": "github",
    "repo": "SakuraMiyu1/sakura-miyu-blog",
    "branch": "main",
    "base_url": "https://sakura-miyu-blog.pages.dev",
    "auth_endpoint": "api/auth",
    "auth_scope": "public_repo",
    "squash_merges": true
  },
  "publish_mode": "editorial_workflow",
  "site_url": "https://sakura-miyu-blog.pages.dev",
  "display_url": "https://sakura-miyu-blog.pages.dev",
  "logo_url": "https://sakura-miyu-blog.pages.dev/favicon.png",
  "locale": "en",
  "show_preview_links": false,
  "media_folder": "public/images/blog",
  "public_folder": "/images/blog",
  "media_processing": {
    "enabled": true,
    "format": {
      "enabled": true,
      "default": "webp"
    },
    "quality": 82,
    "width": 1600,
    "height": null
  },
  "slug": {
    "encoding": "ascii",
    "clean_accents": true,
    "sanitize_replacement": "-"
  },
  "collections": [
    {
      "name": "blog",
      "label": "Articles",
      "label_singular": "Article",
      "folder": "src/content/articles",
      "create": true,
      "delete": false,
      "extension": "json",
      "format": "json",
      "slug": "{{fields.translationKey}}",
      "summary": "{{translationKey}} · {{pubDate}}",
      "sortable_fields": [
        "pubDate",
        "translationKey"
      ],
      "editor": {
        "preview": true
      },
      "fields": [
        {
          "label": "Article ID",
          "name": "translationKey",
          "widget": "string",
          "pattern": [
            "^[a-z0-9]+(?:-[a-z0-9]+)*$",
            "Use lowercase English letters, numbers and hyphens."
          ],
          "hint": "Shared settings for one article. Choose a unique permanent ID such as a-quiet-morning. It becomes the filename and cannot change after creation."
        },
        {
          "label": "Publication date",
          "name": "pubDate",
          "widget": "datetime",
          "format": "YYYY-MM-DD",
          "date_format": "DD/MM/YYYY",
          "time_format": false,
          "picker_utc": true
        },
        {
          "label": "Updated date",
          "name": "updatedDate",
          "widget": "datetime",
          "required": false,
          "default": "",
          "format": "YYYY-MM-DD",
          "date_format": "DD/MM/YYYY",
          "time_format": false,
          "picker_utc": true
        },
        {
          "label": "Category",
          "name": "category",
          "widget": "select",
          "default": "Diary",
          "options": [
            "Diary",
            "Anime",
            "Cosplay",
            "Gaming",
            "Writing",
            "Gothic Kawaii",
            "University",
            "Creative Writing",
            "Fanfiction"
          ]
        },
        {
          "label": "Tags",
          "name": "tags",
          "widget": "list",
          "default": [],
          "field": {
            "label": "Tag",
            "name": "tag",
            "widget": "string",
            "pattern": [
              ".*[A-Za-z0-9\\u00C0-\\uFFFF].*",
              "Include a letter or number."
            ]
          },
          "hint": "Shared tags used by every translation unless that language has its own tag list."
        },
        {
          "label": "Featured image",
          "name": "image",
          "widget": "image",
          "required": false,
          "choose_url": false,
          "allow_multiple": false,
          "media_library": {
            "config": {
              "max_file_size": 5242880
            }
          }
        },
        {
          "label": "Feature on the homepage",
          "name": "featured",
          "widget": "boolean",
          "default": false
        },
        {
          "label": "Keep hidden even after Publish",
          "name": "draft",
          "widget": "boolean",
          "default": false,
          "hint": "Save keeps the whole article in one workflow branch. ON hides every language even after Publish; OFF publishes only complete translations."
        },
        {
          "label": "Translations",
          "name": "translations",
          "widget": "translation-tabs",
          "required": false,
          "collapsed": false,
          "hint": "One article, one Save and one Publish for all three languages. Partial translations stay saved, but only versions with Title, URL slug, Description and Story appear on the site. No automatic translation.",
          "fields": [
            {
              "label": "Українська (UA)",
              "name": "uk",
              "widget": "object",
              "required": false,
              "collapsed": false,
              "fields": [
                {
                  "label": "Title",
                  "name": "title",
                  "widget": "string",
                  "required": false
                },
                {
                  "label": "URL slug",
                  "name": "slug",
                  "widget": "string",
                  "required": false,
                  "pattern": [
                    "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                    "Use lowercase English letters, numbers and hyphens."
                  ],
                  "hint": "Address for this translation, without its language prefix. Keep an existing published slug unchanged."
                },
                {
                  "label": "Description",
                  "name": "description",
                  "widget": "text",
                  "required": false
                },
                {
                  "label": "Featured image alt text",
                  "name": "imageAlt",
                  "widget": "string",
                  "required": false,
                  "hint": "Describe the shared image in this language. Required when this translation is complete and an image is selected."
                },
                {
                  "label": "SEO title",
                  "name": "seoTitle",
                  "widget": "string",
                  "required": false,
                  "pattern": [
                    "^.{0,100}$",
                    "Up to 100 characters."
                  ],
                  "hint": "Leave empty to use the article title."
                },
                {
                  "label": "SEO description",
                  "name": "seoDescription",
                  "widget": "text",
                  "required": false,
                  "pattern": [
                    "^[\\s\\S]{0,200}$",
                    "Up to 200 characters."
                  ],
                  "hint": "Leave empty to use the description."
                },
                {
                  "label": "Story",
                  "name": "body",
                  "widget": "markdown",
                  "modes": [
                    "raw"
                  ],
                  "editor_components": [
                    "image",
                    "code-block"
                  ],
                  "default": "",
                  "hint": "Write this language version in Markdown. It becomes public only when Title, URL slug, Description and Story are all filled.",
                  "required": false
                },
                {
                  "label": "Language-specific tags",
                  "name": "tags",
                  "widget": "list",
                  "field": {
                    "label": "Tag",
                    "name": "tag",
                    "widget": "string",
                    "pattern": [
                      ".*[A-Za-z0-9\\u00C0-\\uFFFF].*",
                      "Include a letter or number."
                    ]
                  },
                  "required": false,
                  "hint": "Leave untouched to inherit shared tags. A saved empty list intentionally hides tags for this language."
                }
              ]
            },
            {
              "label": "English (EN)",
              "name": "en",
              "widget": "object",
              "required": false,
              "collapsed": false,
              "fields": [
                {
                  "label": "Title",
                  "name": "title",
                  "widget": "string",
                  "required": false
                },
                {
                  "label": "URL slug",
                  "name": "slug",
                  "widget": "string",
                  "required": false,
                  "pattern": [
                    "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                    "Use lowercase English letters, numbers and hyphens."
                  ],
                  "hint": "Address for this translation, without its language prefix. Keep an existing published slug unchanged."
                },
                {
                  "label": "Description",
                  "name": "description",
                  "widget": "text",
                  "required": false
                },
                {
                  "label": "Featured image alt text",
                  "name": "imageAlt",
                  "widget": "string",
                  "required": false,
                  "hint": "Describe the shared image in this language. Required when this translation is complete and an image is selected."
                },
                {
                  "label": "SEO title",
                  "name": "seoTitle",
                  "widget": "string",
                  "required": false,
                  "pattern": [
                    "^.{0,100}$",
                    "Up to 100 characters."
                  ],
                  "hint": "Leave empty to use the article title."
                },
                {
                  "label": "SEO description",
                  "name": "seoDescription",
                  "widget": "text",
                  "required": false,
                  "pattern": [
                    "^[\\s\\S]{0,200}$",
                    "Up to 200 characters."
                  ],
                  "hint": "Leave empty to use the description."
                },
                {
                  "label": "Story",
                  "name": "body",
                  "widget": "markdown",
                  "modes": [
                    "raw"
                  ],
                  "editor_components": [
                    "image",
                    "code-block"
                  ],
                  "default": "",
                  "hint": "Write this language version in Markdown. It becomes public only when Title, URL slug, Description and Story are all filled.",
                  "required": false
                },
                {
                  "label": "Language-specific tags",
                  "name": "tags",
                  "widget": "list",
                  "field": {
                    "label": "Tag",
                    "name": "tag",
                    "widget": "string",
                    "pattern": [
                      ".*[A-Za-z0-9\\u00C0-\\uFFFF].*",
                      "Include a letter or number."
                    ]
                  },
                  "required": false,
                  "hint": "Leave untouched to inherit shared tags. A saved empty list intentionally hides tags for this language."
                }
              ]
            },
            {
              "label": "日本語 (JP)",
              "name": "ja",
              "widget": "object",
              "required": false,
              "collapsed": false,
              "fields": [
                {
                  "label": "Title",
                  "name": "title",
                  "widget": "string",
                  "required": false
                },
                {
                  "label": "URL slug",
                  "name": "slug",
                  "widget": "string",
                  "required": false,
                  "pattern": [
                    "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                    "Use lowercase English letters, numbers and hyphens."
                  ],
                  "hint": "Address for this translation, without its language prefix. Keep an existing published slug unchanged."
                },
                {
                  "label": "Description",
                  "name": "description",
                  "widget": "text",
                  "required": false
                },
                {
                  "label": "Featured image alt text",
                  "name": "imageAlt",
                  "widget": "string",
                  "required": false,
                  "hint": "Describe the shared image in this language. Required when this translation is complete and an image is selected."
                },
                {
                  "label": "SEO title",
                  "name": "seoTitle",
                  "widget": "string",
                  "required": false,
                  "pattern": [
                    "^.{0,100}$",
                    "Up to 100 characters."
                  ],
                  "hint": "Leave empty to use the article title."
                },
                {
                  "label": "SEO description",
                  "name": "seoDescription",
                  "widget": "text",
                  "required": false,
                  "pattern": [
                    "^[\\s\\S]{0,200}$",
                    "Up to 200 characters."
                  ],
                  "hint": "Leave empty to use the description."
                },
                {
                  "label": "Story",
                  "name": "body",
                  "widget": "markdown",
                  "modes": [
                    "raw"
                  ],
                  "editor_components": [
                    "image",
                    "code-block"
                  ],
                  "default": "",
                  "hint": "Write this language version in Markdown. It becomes public only when Title, URL slug, Description and Story are all filled.",
                  "required": false
                },
                {
                  "label": "Language-specific tags",
                  "name": "tags",
                  "widget": "list",
                  "field": {
                    "label": "Tag",
                    "name": "tag",
                    "widget": "string",
                    "pattern": [
                      ".*[A-Za-z0-9\\u00C0-\\uFFFF].*",
                      "Include a letter or number."
                    ]
                  },
                  "required": false,
                  "hint": "Leave untouched to inherit shared tags. A saved empty list intentionally hides tags for this language."
                }
              ]
            }
          ]
        }
      ],
      "identifier_field": "translationKey"
    }
  ]
}
